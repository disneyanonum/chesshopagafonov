<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agafonov Coach Chess</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; min-height: 100vh; background-color: #f6f1e7; background-image: radial-gradient(circle at top right, rgba(185,146,82,0.15), transparent 28%), radial-gradient(circle at bottom left, rgba(49,70,59,0.12), transparent 30%), linear-gradient(135deg, rgba(255,255,255,0.35) 25%, transparent 25%), linear-gradient(225deg, rgba(255,255,255,0.18) 25%, transparent 25%); background-size: auto, auto, 40px 40px, 40px 40px; color: #2e2f33; }
    button, input, textarea, select { font: inherit; }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 20px; }
    .card { background: rgba(255,255,255,0.96); border: 1px solid rgba(185,146,82,0.14); border-radius: 28px; box-shadow: 0 18px 60px rgba(0,0,0,0.08); }
    .subtle-box { background: rgba(235,228,214,0.5); border-radius: 18px; padding: 14px; }
    .badge { display: inline-flex; border-radius: 999px; padding: 6px 10px; background: rgba(185,146,82,0.12); color: #b99252; font-size: 12px; font-weight: 700; border: 1px solid rgba(185,146,82,0.25); }
    .btn { border: none; border-radius: 16px; padding: 12px 18px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; }
    .btn-primary { background: #2e2f33; color: #fff; box-shadow: 0 10px 24px rgba(46,47,51,0.16); }
    .btn-secondary { background: #fff; color: #2e2f33; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1); }
    .btn-danger { background: #6b3b42; color: #fff; box-shadow: 0 10px 24px rgba(107,59,66,0.16); }
    .field { width: 100%; border-radius: 16px; border: 1px solid rgba(0,0,0,0.1); padding: 12px 14px; font-size: 14px; background: #fff; }
    .section-title { font-size: 34px; line-height: 1.15; margin: 0; font-weight: 900; letter-spacing: -0.02em; }
    header { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px); background: rgba(247,243,235,0.82); border-bottom: 1px solid rgba(0,0,0,0.06); }
    .header-inner { height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    nav { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
    .nav-link { background: transparent; border: none; cursor: pointer; color: #2e2f33; font-size: 14px; font-weight: 600; }
    main { padding: 24px 20px 60px; } footer { border-top: 1px solid rgba(0,0,0,0.06); padding: 22px 20px 32px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; } .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; } .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; } .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .empty-state { padding: 24px; } .service-card { padding: 22px; display: flex; flex-direction: column; justify-content: space-between; min-height: 300px; } .review-card { padding: 24px; display: grid; gap: 14px; background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,244,236,0.98)); } .stat-card { padding: 18px; } .hero-title { font-size: 54px; line-height: 1.02; margin: 18px 0 0; font-weight: 900; letter-spacing: -0.03em; } .small-muted { color: rgba(46,47,51,0.58); font-size: 13px; }
    @media (max-width: 1180px) { .grid-2, .grid-3, .grid-4, .grid-5, .grid-home, .admin-options { grid-template-columns: 1fr !important; } .header-inner { height: auto; padding: 14px 0; } .hero-title { font-size: 38px; } }
  </style>
</head>
<body>
  <header><div class="container header-inner"><button id="homeLogo" class="nav-link" style="font-size:20px;font-weight:900;">Agafonov Coach Chess</button><nav><button class="nav-link" data-view="services">Услуги</button><button class="nav-link" data-view="about">Обо мне</button><button class="nav-link" data-view="reviews">Отзывы</button><button class="nav-link" data-view="profile">Профиль</button><button id="adminNavBtn" class="btn btn-primary" style="background:#b99252;padding:10px 14px;">Админ</button></nav></div></header>
  <main class="container"><div id="app"></div></main>
  <footer><div class="container" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:rgba(46,47,51,0.66);font-size:14px;"><div>© 2026 Agafonov Coach Chess</div><div>Шахматные услуги, обучение, разбор партий, турниры и практические сессии.</div></div></footer>
<script>
const state={ready:false,bootError:'',view:'home',selectedServiceId:null,draftCheckout:null,reviewFilter:'all',profileFilter:'all',services:[],reviews:[],admin:{authed:false,tab:'orders',services:[],orders:[],reviews:[],payouts:[]}};
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatPrice=p=>Number(p||0).toLocaleString('ru-RU')+' ₽';
const formatDate=v=>new Date(v).toLocaleDateString('ru-RU');
const formatDateTime=v=>new Date(v).toLocaleString('ru-RU');
const badge=t=>'<span class="badge">'+esc(t)+'</span>';
const minEnabledPrice=s=>{const e=(s.options||[]).filter(i=>i.enabled!==false); return e.length?Math.min(...e.map(i=>Number(i.price||0))):Number(s.basePrice||0);};
const statusLabel=s=>({DEMO_PAID:'Оплачено',PENDING_FULFILLMENT:'Ожидает выполнения',IN_PROGRESS:'Выполняется',DONE_BY_ADMIN:'Выполнено администратором',CONFIRMED_BY_CLIENT:'Подтверждено клиентом',REVIEW_LEFT:'Отзыв оставлен'}[s]||s);
const avg=a=>a.length?(a.reduce((x,y)=>x+Number(y.rating||0),0)/a.length).toFixed(1):'0.0';
const selectedService=()=>state.services.find(s=>s.id===state.selectedServiceId)||null;
const filteredReviews=()=>state.reviewFilter==='all'?state.reviews:state.reviews.filter(r=>Number(r.rating)===Number(state.reviewFilter));
const profileReviews=()=>state.profileFilter==='all'?state.reviews:state.reviews.filter(r=>Number(r.rating)===Number(state.profileFilter));
const turnover=()=>state.admin.orders.filter(o=>['DEMO_PAID','PENDING_FULFILLMENT','IN_PROGRESS','DONE_BY_ADMIN','CONFIRMED_BY_CLIENT','REVIEW_LEFT'].includes(o.status)).reduce((s,o)=>s+Number(o.amount||0),0);
const totalPayouts=()=>state.admin.payouts.reduce((s,p)=>s+Number(p.amount||0),0);
const balance=()=>Math.max(turnover()-totalPayouts(),0);
async function api(path, options={}){const r=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json',...(options.headers||{})},...options}); const raw=await r.text(); let data={}; try{data=raw?JSON.parse(raw):{}}catch{data={raw}} if(!r.ok) throw new Error(data.error||data.message||('HTTP '+r.status)); return data;}
async function loadPublic(){const d=await api('/api/bootstrap'); state.services=Array.isArray(d.services)?d.services:[]; state.reviews=Array.isArray(d.reviews)?d.reviews:[]; state.bootError=''; state.ready=true;}
async function loadAdmin(){const d=await api('/api/admin/bootstrap'); state.admin.authed=true; state.admin.services=d.services||[]; state.admin.orders=d.orders||[]; state.admin.reviews=d.reviews||[]; state.admin.payouts=d.payouts||[];}
async function refreshAll(){try{await loadPublic(); if(state.admin.authed){try{await loadAdmin();}catch{state.admin.authed=false; if(state.view==='admin') state.view='admin-login';}}}catch(e){state.bootError=e.message||'Ошибка запроса';} render();}
const serviceCard=s=>'<div class="card service-card" style="background:linear-gradient(180deg, rgba(255,255,255,0.98), '+esc(s.heroAccent||'rgba(185,146,82,0.12)')+')"><div><div style="display:flex;justify-content:space-between;gap:12px;align-items:start;"><div><div style="font-size:22px;font-weight:800;line-height:1.2;">'+esc(s.title)+'</div><div style="font-size:14px;line-height:1.7;margin-top:10px;color:rgba(46,47,51,0.72);">'+esc(s.shortDesc)+'</div></div>'+(s.badge?badge(s.badge):'')+'</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;"><span class="badge" style="background:rgba(49,70,59,0.08);color:#31463b;border-color:rgba(49,70,59,0.18);">'+esc(s.category)+'</span></div><div class="subtle-box" style="margin-top:18px;">От <strong>'+esc(formatPrice(minEnabledPrice(s)))+'</strong></div></div><div style="display:flex;gap:10px;margin-top:18px;"><button class="btn btn-primary" data-action="openService" data-id="'+esc(s.id)+'" style="width:100%;">Выбрать</button></div></div>';
const reviewCard=r=>'<div class="card review-card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:start;"><div><div style="font-weight:800;font-size:18px;">'+esc(r.customerName)+'</div><div style="font-size:13px;color:rgba(46,47,51,0.58);margin-top:6px;">Отзыв от '+esc(formatDate(r.createdAt))+'</div></div>'+badge((r.rating||0)+' ★')+'</div><div class="subtle-box" style="display:grid;gap:8px;"><div style="font-size:14px;font-weight:700;">'+esc(r.serviceTitle)+'</div><div style="font-size:13px;color:rgba(46,47,51,0.7)">Вариант: '+esc(r.optionLabel)+'</div><div style="font-size:13px;color:rgba(46,47,51,0.7)">Сумма заказа: '+esc(formatPrice(r.amount))+'</div><div style="font-size:13px;color:rgba(46,47,51,0.7)">Куплено: '+esc(formatDate(r.purchasedAt))+'</div></div><div style="color:rgba(46,47,51,0.82);line-height:1.8;font-size:14px;">'+esc(r.text)+'</div>'+(r.adminReply?'<div style="border-radius:18px;padding:14px;background:rgba(185,146,82,0.06);border:1px solid rgba(185,146,82,0.2)"><div style="font-size:11px;color:#b99252;font-weight:800;text-transform:uppercase;letter-spacing:2px;">Ответ Agafonov Chess</div><div style="margin-top:8px;font-size:14px;color:rgba(46,47,51,0.8)">'+esc(r.adminReply)+'</div></div>':'')+'</div>';
const infoBox=(l,v,st='')=>'<div class="subtle-box" style="'+st+'"><div class="small-muted">'+esc(l)+'</div><div style="margin-top:6px;font-weight:700;">'+esc(v)+'</div></div>';
function homeView(){return '<section style="padding:34px 0 16px;"><div class="grid-home" style="display:grid;gap:24px;grid-template-columns:1.4fr 0.9fr;"><div class="card" style="padding:34px;background:radial-gradient(circle at top right, rgba(185,146,82,0.14), transparent 30%), linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,244,236,0.96));">'+badge('Работает с 2026 года')+'<h1 class="hero-title">Agafonov Coach Chess</h1><p style="color:#b99252;font-weight:800;font-size:20px;margin-top:12px;">Тренер по Шахматам</p><p style="max-width:720px;color:rgba(46,47,51,0.75);line-height:1.8;margin-top:18px;font-size:15px;">Онлайн-магазин шахматных услуг: поднятие рейтинга, обучение, турниры, разбор партий и практические игровые сессии с заказами через сайт.</p><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;"><button class="btn btn-primary" data-view="services">Выбрать услугу</button><button class="btn btn-secondary" data-view="about">Обо мне</button></div><div class="grid-3" style="margin-top:24px;"><div class="subtle-box" style="background:rgba(235,228,214,0.62)"><div style="font-size:28px;font-weight:900;">13k+</div><div style="font-size:13px;color:rgba(46,47,51,0.62);margin-top:6px;">партий за всё время</div></div><div class="subtle-box" style="background:rgba(235,228,214,0.62)"><div style="font-size:28px;font-weight:900;">904</div><div style="font-size:13px;color:rgba(46,47,51,0.62);margin-top:6px;">сыгранных турнира</div></div><div class="subtle-box" style="background:rgba(235,228,214,0.62)"><div style="font-size:28px;font-weight:900;">130+</div><div style="font-size:13px;color:rgba(46,47,51,0.62);margin-top:6px;">завершённых курсов</div></div></div></div><div class="card" style="padding:28px;background:#2e2f33;color:#fff;"><div style="font-size:12px;text-transform:uppercase;letter-spacing:3px;color:rgba(255,255,255,0.56)">Профиль продавца</div><div style="display:flex;gap:14px;align-items:center;margin-top:18px;"><div style="width:72px;height:72px;border-radius:24px;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;">A</div><div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><div style="font-size:24px;font-weight:900;">Agafonov Chess</div><span class="badge" style="background:#b99252;color:#fff;border-color:transparent">✓</span></div><div style="font-size:14px;color:rgba(255,255,255,0.72);margin-top:4px;">Администратор</div></div></div><p style="line-height:1.75;font-size:14px;margin-top:22px;color:rgba(255,255,255,0.82)">Шахматист-самоучка, лига Легенда 2024–2025, опыт в рейтинговых матчах, турнирах и тактическом обучении.</p><div class="grid-2" style="margin-top:24px;gap:12px;"><div style="background:rgba(255,255,255,0.1);border-radius:18px;padding:16px;"><div style="font-size:24px;font-weight:900;">'+avg(state.reviews)+'</div><div style="font-size:13px;color:rgba(255,255,255,0.68)">средняя оценка</div></div><div style="background:rgba(255,255,255,0.1);border-radius:18px;padding:16px;"><div style="font-size:24px;font-weight:900;">'+state.reviews.length+'</div><div style="font-size:13px;color:rgba(255,255,255,0.68)">отзывов</div></div></div></div></div></section><section style="padding:18px 0 8px;"><h2 class="section-title" style="font-size:30px;">Почему выбирают меня</h2><p style="color:rgba(46,47,51,0.7);margin-bottom:20px;margin-top:10px;">Индивидуальный подход, понятный процесс заказа и аккуратная премиальная подача.</p><div class="grid-4"><div class="card" style="padding:22px;"><div style="font-weight:900;">Быстрые заказы</div><div style="color:rgba(46,47,51,0.7);font-size:14px;line-height:1.7;margin-top:10px;">Простой путь от выбора услуги до подтверждения заказа через сайт.</div></div><div class="card" style="padding:22px;"><div style="font-weight:900;">Удобный выбор</div><div style="color:rgba(46,47,51,0.7);font-size:14px;line-height:1.7;margin-top:10px;">Карточки услуг, варианты, цены и подробные описания.</div></div><div class="card" style="padding:22px;"><div style="font-weight:900;">Индивидуальный подход</div><div style="color:rgba(46,47,51,0.7);font-size:14px;line-height:1.7;margin-top:10px;">Подбор подхода под рейтинг, цель и игровой стиль.</div></div><div class="card" style="padding:22px;"><div style="font-weight:900;">Онлайн-данные</div><div style="color:rgba(46,47,51,0.7);font-size:14px;line-height:1.7;margin-top:10px;">Новые заказы и отзывы сразу видны в админке.</div></div></div></section><section style="padding:28px 0 8px;"><div style="margin-bottom:18px;"><h2 class="section-title" style="font-size:30px;">Популярные услуги</h2><p style="color:rgba(46,47,51,0.7);margin-top:10px;">Ключевые направления с быстрым доступом к заказу.</p></div><div class="grid-3">'+state.services.slice(0,3).map(serviceCard).join('')+'</div></section><section style="padding:28px 0 8px;"><h2 class="section-title" style="font-size:30px;">Последние отзывы</h2><p style="color:rgba(46,47,51,0.7);margin-bottom:18px;margin-top:10px;">Отзывы клиентов с указанием услуги, варианта и суммы заказа.</p><div class="grid-3">'+state.reviews.slice(0,3).map(reviewCard).join('')+'</div></section>';}
function servicesView(){return '<div><h1 class="section-title">Услуги</h1><p style="color:rgba(46,47,51,0.7);margin-bottom:18px;margin-top:10px;">Выберите направление, вариант и оформите заказ в пару кликов.</p><div class="grid-3">'+state.services.map(serviceCard).join('')+'</div></div>';}
function serviceView(){const s=selectedService(); if(!s) return '<div class="card empty-state">Услуга не найдена.</div>'; const active=(s.options||[]).filter(i=>i.enabled!==false); const def=active[0]; return '<div class="grid-2" style="grid-template-columns:1.2fr 0.8fr;"><div class="card" style="padding:28px;"><div style="display:flex;justify-content:space-between;gap:12px;align-items:start;"><div><h1 class="section-title">'+esc(s.title)+'</h1><p style="margin-top:12px;color:rgba(46,47,51,0.72);line-height:1.8;">'+esc(s.description)+'</p></div>'+(s.badge?badge(s.badge):'')+'</div><div class="subtle-box" style="margin-top:24px;"><div style="font-weight:900;">Доступные варианты</div><div style="margin-top:12px;display:grid;gap:10px;">'+(s.options||[]).map(o=>'<div style="background:#fff;border-radius:18px;padding:14px;display:flex;justify-content:space-between;gap:10px;"><div style="font-weight:600;">'+esc(o.label)+'</div><div style="font-weight:800;">'+(o.enabled===false?'Недоступно':esc(formatPrice(o.price)))+'</div></div>').join('')+'</div></div></div><div class="card" style="padding:28px;"><div style="font-size:12px;text-transform:uppercase;letter-spacing:3px;color:#b99252;font-weight:800;">Оформление заказа</div><p style="margin-top:14px;color:rgba(46,47,51,0.72);line-height:1.75;">После подтверждения заказ сразу появится в админке. Раздел заказов скрыт от обычных посетителей сайта.</p><div style="margin-top:16px;display:grid;gap:14px;"><div><label style="display:block;margin-bottom:8px;font-size:14px;font-weight:700;">Ваше имя</label><input id="customerNameInput" class="field" placeholder="Например, KnightRush"></div><div><label style="display:block;margin-bottom:8px;font-size:14px;font-weight:700;">Выберите вариант</label><select id="optionSelect" class="field">'+active.map(o=>'<option value="'+esc(o.id)+'"'+(def&&o.id===def.id?' selected':'')+'>'+esc(o.label)+' — '+esc(formatPrice(o.price))+'</option>').join('')+'</select></div><div><label style="display:block;margin-bottom:8px;font-size:14px;font-weight:700;">Комментарий к заказу</label><textarea id="noteInput" rows="4" class="field" placeholder="Дополнительные пожелания"></textarea></div><button class="btn btn-primary" data-action="startCheckout" data-id="'+esc(s.id)+'" style="width:100%;">Перейти к подтверждению</button></div></div></div>';}
function checkoutView(){if(!state.draftCheckout) return '<div class="card empty-state">Нет данных для оформления заказа.</div>'; const s=state.services.find(i=>i.id===state.draftCheckout.serviceId); const o=s?(s.options||[]).find(i=>i.id===state.draftCheckout.optionId):null; if(!s||!o) return '<div class="card empty-state">Услуга или вариант не найдены.</div>'; return '<div style="max-width:900px;margin:0 auto;"><div class="card" style="padding:28px;"><div style="font-size:12px;text-transform:uppercase;letter-spacing:3px;color:#b99252;font-weight:800;">Подтверждение заказа</div><h1 class="section-title" style="margin-top:12px;">Проверьте данные</h1><p style="color:rgba(46,47,51,0.72);line-height:1.8;margin-top:10px;">После подтверждения заказ сразу увидит администратор в панели управления.</p><div class="grid-2" style="gap:14px;margin-top:22px;">'+infoBox('Услуга',s.title)+infoBox('Вариант',o.label)+infoBox('Клиент',state.draftCheckout.customerName)+infoBox('Сумма',formatPrice(o.price))+'</div>'+(state.draftCheckout.note?infoBox('Комментарий',state.draftCheckout.note,'margin-top:14px;'):'')+'<button class="btn btn-primary" data-action="createOrder" style="width:100%;margin-top:22px;">Создать заказ</button></div></div>';}
function reviewsView(){return '<div><h1 class="section-title">Отзывы</h1><p style="color:rgba(46,47,51,0.7);margin-bottom:16px;margin-top:10px;">Фильтрация по оценке и ответы администратора.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;">'+['all',5,4,3,2,1].map(i=>'<button class="btn '+(String(state.reviewFilter)===String(i)?'btn-primary':'btn-secondary')+'" data-action="setReviewFilter" data-value="'+i+'" style="padding:10px 14px;">'+(i==='all'?'Все':i+' ★')+'</button>').join('')+'</div><div class="grid-3">'+filteredReviews().map(reviewCard).join('')+'</div></div>';}
function profileView(){return '<div><h1 class="section-title">Профиль</h1><p style="color:rgba(46,47,51,0.7);margin-bottom:18px;margin-top:10px;">Agafonov Chess — подтверждённый профиль администратора.</p><div class="grid-2" style="grid-template-columns:0.9fr 1.1fr;"><div class="card" style="padding:26px;background:#2e2f33;color:#fff;"><div style="display:flex;align-items:center;gap:14px;"><div style="width:84px;height:84px;border-radius:26px;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;">A</div><div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><div style="font-size:28px;font-weight:900;">Agafonov Chess</div><span class="badge" style="background:#b99252;color:#fff;border-color:transparent">✓</span></div><div style="color:rgba(255,255,255,0.72);margin-top:4px;">Администратор</div></div></div><p style="margin-top:20px;color:rgba(255,255,255,0.82);line-height:1.8;font-size:14px;">Шахматист-самоучка, играю 3 года, лига Легенда в 2024–2025, более 13k партий и 904 турниров.</p><div class="grid-3" style="gap:10px;margin-top:18px;"><div style="background:rgba(255,255,255,0.1);border-radius:18px;padding:14px;"><div style="font-size:24px;font-weight:900;">'+state.reviews.length+'</div><div style="font-size:12px;color:rgba(255,255,255,0.7)">отзывов</div></div><div style="background:rgba(255,255,255,0.1);border-radius:18px;padding:14px;"><div style="font-size:24px;font-weight:900;">'+avg(state.reviews)+'</div><div style="font-size:12px;color:rgba(255,255,255,0.7)">рейтинг</div></div><div style="background:rgba(255,255,255,0.1);border-radius:18px;padding:14px;"><div style="font-size:24px;font-weight:900;">'+(state.admin.authed?state.admin.orders.filter(o=>['DONE_BY_ADMIN','CONFIRMED_BY_CLIENT','REVIEW_LEFT'].includes(o.status)).length:'—')+'</div><div style="font-size:12px;color:rgba(255,255,255,0.7)">выполнено</div></div></div></div><div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">'+['all',5,4,3,2,1].map(i=>'<button class="btn '+(String(state.profileFilter)===String(i)?'btn-primary':'btn-secondary')+'" data-action="setProfileFilter" data-value="'+i+'" style="padding:10px 14px;">'+(i==='all'?'Все отзывы':i+' ★')+'</button>').join('')+'</div><div style="display:grid;gap:12px;">'+profileReviews().map(reviewCard).join('')+'</div></div></div></div>';}
function aboutView(){return '<div><h1 class="section-title">Обо мне</h1><p style="color:rgba(46,47,51,0.7);margin-bottom:18px;margin-top:10px;">История, достижения, опыт и преимущества работы.</p><div class="grid-2" style="grid-template-columns:1.1fr 0.9fr;"><div class="card" style="padding:26px;"><span class="badge">Agafonov Chess</span><p style="margin-top:18px;line-height:1.9;color:rgba(46,47,51,0.82)">Agafonov Chess — шахматист-самоучка, играю на протяжении 3-х лет. Имел Лигу Легенда (2024–2025). Сыграл свыше 13k+ партий за всё время. Сыграл 904 турнира за всё время. Прошёл теоретические курсы chess.com. Завершил свыше 130 курсов старшей игры. Спеши получить помощь от профи.</p></div><div class="card" style="padding:26px;background:#2e2f33;color:#fff;"><h3 style="font-size:24px;margin-top:0;margin-bottom:12px;">Преимущества</h3><ul style="margin:0;padding-left:18px;line-height:2;color:rgba(255,255,255,0.82)"><li>Индивидуальный подбор услуг под рейтинг и цель.</li><li>Онлайн-обучение на 1–3 часа с понятной структурой.</li><li>Отдельные тактические модули и полноценная программа.</li><li>Онлайн-сайт с живой админкой и общими отзывами.</li></ul></div></div></div>';}
function adminLoginView(){return '<div style="max-width:480px;margin:40px auto 0;"><div class="card" style="padding:28px;"><div style="font-size:12px;text-transform:uppercase;letter-spacing:3px;color:#b99252;font-weight:800;">Вход администратора</div><h1 class="section-title" style="margin-top:12px;">Agafonov Admin</h1><div style="margin-top:18px;display:grid;gap:14px;"><input id="adminPasswordInput" type="password" class="field" placeholder="Пароль"><button class="btn btn-primary" data-action="loginAdmin" style="width:100%;">Войти</button></div></div></div>';}
function adminView(){const t=state.admin.tab,sv=state.admin.services,od=state.admin.orders,rv=state.admin.reviews,pv=state.admin.payouts; let c=''; if(t==='orders'){c='<div class="card" style="padding:22px;"><h2 style="font-size:24px;margin-top:0;margin-bottom:6px;">Заказы</h2><div style="display:grid;gap:12px;">'+od.map(o=>'<div style="border-top:1px solid rgba(0,0,0,0.06);padding-top:12px;"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;"><div><div style="font-weight:800;">'+esc(o.serviceTitle)+'</div><div style="font-size:14px;color:rgba(46,47,51,0.64);margin-top:4px;">'+esc(o.optionLabel)+' · '+esc(o.customerName)+'</div><div style="font-size:13px;color:rgba(46,47,51,0.54);margin-top:4px;">'+esc(formatPrice(o.amount))+' · '+esc(formatDateTime(o.createdAt))+'</div>'+(o.note?'<div style="font-size:13px;color:rgba(46,47,51,0.72);margin-top:6px;">Комментарий: '+esc(o.note)+'</div>':'')+'</div><select class="field" style="width:260px;padding:10px 12px;" data-action="updateOrderStatus" data-id="'+esc(o.id)+'">'+['DEMO_PAID','PENDING_FULFILLMENT','IN_PROGRESS','DONE_BY_ADMIN','CONFIRMED_BY_CLIENT','REVIEW_LEFT'].map(s=>'<option value="'+s+'"'+(o.status===s?' selected':'')+'>'+esc(statusLabel(s))+'</option>').join('')+'</select></div></div>').join('')+'</div></div>';} if(t==='services'){c='<div class="card" style="padding:22px;"><h2 style="font-size:24px;margin-top:0;margin-bottom:6px;">Товары и цены</h2><div style="display:grid;gap:14px;">'+sv.map(s=>'<div style="border-top:1px solid rgba(0,0,0,0.06);padding-top:14px;"><div style="display:grid;gap:10px;"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;"><strong>'+esc(s.title)+'</strong><label style="display:flex;align-items:center;gap:8px;font-size:14px;">Базовая цена <input class="field" style="width:120px;padding:8px 10px;" type="number" value="'+esc(s.basePrice)+'" data-action="updateServiceBasePrice" data-id="'+esc(s.id)+'"></label></div><div style="display:grid;gap:10px;">'+(s.options||[]).map(o=>'<div class="admin-options" style="display:grid;grid-template-columns:1fr 120px 120px;gap:10px;align-items:center;"><div style="font-size:14px;">'+esc(o.label)+'</div><input class="field" style="padding:8px 10px;" type="number" value="'+esc(o.price)+'" data-action="updateOptionPrice" data-service="'+esc(s.id)+'" data-id="'+esc(o.id)+'"><button class="btn '+(o.enabled!==false?'btn-primary':'btn-secondary')+'" data-action="toggleOption" data-service="'+esc(s.id)+'" data-id="'+esc(o.id)+'">'+(o.enabled===false?'Включить':'Выключить')+'</button></div>').join('')+'</div></div></div>').join('')+'</div></div>';} if(t==='reviews'){c='<div class="card" style="padding:22px;"><h2 style="font-size:24px;margin-top:0;margin-bottom:6px;">Отзывы</h2><div style="display:grid;gap:12px;">'+rv.map(r=>'<div style="border-top:1px solid rgba(0,0,0,0.06);padding-top:12px;"><div style="display:flex;justify-content:space-between;gap:10px;align-items:start;"><div><div style="font-weight:800;">'+esc(r.customerName)+'</div><div style="font-size:13px;color:rgba(46,47,51,0.56);margin-top:4px;">'+esc(r.serviceTitle)+' · '+esc(r.optionLabel)+' · '+esc(formatPrice(r.amount))+'</div></div>'+badge((r.rating||0)+' ★')+'</div><div style="margin-top:10px;font-size:14px;color:rgba(46,47,51,0.78);line-height:1.7;">'+esc(r.text)+'</div><div style="display:grid;gap:8px;margin-top:12px;"><input id="reply-'+esc(r.id)+'" class="field" value="'+esc(r.adminReply||'')+'" placeholder="Ответ администратора"><div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-primary" data-action="replyToReview" data-id="'+esc(r.id)+'">Сохранить ответ</button><button class="btn btn-danger" data-action="deleteReview" data-id="'+esc(r.id)+'">Удалить отзыв</button></div></div></div>').join('')+'</div></div>';} if(t==='finance'){c='<div class="card" style="padding:22px;"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;"><h2 style="font-size:24px;margin:0;">Баланс и выплаты</h2>'+badge('Финансы')+'</div><div class="grid-3" style="gap:12px;margin-top:16px;"><div class="subtle-box"><div style="font-size:12px;color:rgba(46,47,51,0.58);">Оборот</div><div style="margin-top:8px;font-size:22px;font-weight:800;">'+esc(formatPrice(turnover()))+'</div></div><div class="subtle-box"><div style="font-size:12px;color:rgba(46,47,51,0.58);">Выведено</div><div style="margin-top:8px;font-size:22px;font-weight:800;">'+esc(formatPrice(totalPayouts()))+'</div></div><div class="subtle-box"><div style="font-size:12px;color:rgba(46,47,51,0.58);">Баланс</div><div style="margin-top:8px;font-size:22px;font-weight:800;">'+esc(formatPrice(balance()))+'</div></div></div><div style="display:grid;gap:10px;margin-top:16px;"><input id="cardNumber" class="field" placeholder="Номер карты"><input id="payoutAmount" class="field" placeholder="Сумма" type="number"><button class="btn btn-primary" data-action="createPayout">Создать заявку на вывод</button></div><div style="margin-top:16px;display:grid;gap:10px;">'+pv.map(p=>'<div class="subtle-box"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;"><strong>'+esc(formatPrice(p.amount))+'</strong>'+badge('Создано')+'</div><div style="font-size:14px;color:rgba(46,47,51,0.62);margin-top:6px;">'+esc(p.cardNumber)+'</div><div style="font-size:12px;color:rgba(46,47,51,0.52);margin-top:6px;">'+esc(formatDateTime(p.createdAt))+'</div></div>').join('')+'</div></div>';} return '<div><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;"><div><h1 class="section-title">Админ-панель</h1><p style="color:rgba(46,47,51,0.7);margin-top:10px;">Заказы скрыты от обычных посетителей и доступны только здесь.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-secondary" data-action="reloadAdmin">Обновить</button><button class="btn btn-secondary" data-action="logoutAdmin">Выйти</button><button class="btn btn-danger" data-action="resetAllData">Сбросить все данные</button></div></div><div class="grid-5" style="margin-top:16px;"><div class="card stat-card"><div class="small-muted">Услуги</div><div style="margin-top:10px;font-size:28px;font-weight:900;">'+sv.length+'</div></div><div class="card stat-card"><div class="small-muted">Заказы</div><div style="margin-top:10px;font-size:28px;font-weight:900;">'+od.length+'</div></div><div class="card stat-card"><div class="small-muted">Отзывы</div><div style="margin-top:10px;font-size:28px;font-weight:900;">'+rv.length+'</div></div><div class="card stat-card"><div class="small-muted">Оборот</div><div style="margin-top:10px;font-size:28px;font-weight:900;">'+esc(formatPrice(turnover()))+'</div></div><div class="card stat-card"><div class="small-muted">Заявки на вывод</div><div style="margin-top:10px;font-size:28px;font-weight:900;">'+pv.length+'</div></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px;">'+['orders','services','reviews','finance'].map(n=>'<button class="btn '+(state.admin.tab===n?'btn-primary':'btn-secondary')+'" data-action="setAdminTab" data-value="'+n+'">'+({orders:'Заказы',services:'Товары и цены',reviews:'Отзывы',finance:'Финансы'}[n])+'</button>').join('')+'</div>'+c+'</div>';}
function currentViewHtml(){ if(state.bootError) return '<div class="card empty-state">Ошибка запуска сайта: '+esc(state.bootError)+'</div>'; if(state.view==='home') return homeView(); if(state.view==='services') return servicesView(); if(state.view==='service') return serviceView(); if(state.view==='checkout') return checkoutView(); if(state.view==='reviews') return reviewsView(); if(state.view==='profile') return profileView(); if(state.view==='about') return aboutView(); if(state.view==='admin-login') return adminLoginView(); if(state.view==='admin') return state.admin.authed?adminView():adminLoginView(); return homeView(); }
function bind(){document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{state.view=el.getAttribute('data-view'); render();}); document.querySelectorAll('[data-action]').forEach(el=>{const a=el.getAttribute('data-action'); if(el.tagName==='SELECT'||(el.tagName==='INPUT'&&['updateServiceBasePrice','updateOptionPrice'].includes(a))){el.onchange=act;}else{el.onclick=act;}}); document.getElementById('homeLogo').onclick=()=>{state.view='home'; refreshAll();}; document.getElementById('adminNavBtn').onclick=()=>{state.view=state.admin.authed?'admin':'admin-login'; render();};}
async function act(e){const el=e.currentTarget,a=el.getAttribute('data-action'),id=el.getAttribute('data-id'),sid=el.getAttribute('data-service'),v=el.getAttribute('data-value'); try{if(a==='openService'){state.selectedServiceId=id; state.view='service'; render(); return;} if(a==='startCheckout'){const name=(document.getElementById('customerNameInput')||{}).value||'Гость'; const optionId=(document.getElementById('optionSelect')||{}).value||''; const note=(document.getElementById('noteInput')||{}).value||''; state.draftCheckout={serviceId:id, optionId, customerName:name.trim()||'Гость', note:note.trim()}; state.view='checkout'; render(); return;} if(a==='createOrder'){await api('/api/orders',{method:'POST',body:JSON.stringify(state.draftCheckout)}); state.draftCheckout=null; state.view='home'; await refreshAll(); alert('Заказ создан. Администратор уже видит его в панели.'); return;} if(a==='setReviewFilter'){state.reviewFilter=v; render(); return;} if(a==='setProfileFilter'){state.profileFilter=v; render(); return;} if(a==='loginAdmin'){const password=(document.getElementById('adminPasswordInput')||{}).value||''; await api('/api/admin/login',{method:'POST',body:JSON.stringify({password})}); state.admin.authed=true; state.view='admin'; await refreshAll(); return;} if(a==='logoutAdmin'){await api('/api/admin/logout',{method:'POST',body:JSON.stringify({})}); state.admin.authed=false; state.view='home'; await refreshAll(); return;} if(a==='reloadAdmin'){await refreshAll(); return;} if(a==='setAdminTab'){state.admin.tab=v; render(); return;} if(a==='updateOrderStatus'){await api('/api/admin/orders/'+encodeURIComponent(id)+'/status',{method:'POST',body:JSON.stringify({status:el.value})}); await refreshAll(); return;} if(a==='updateServiceBasePrice'){await api('/api/admin/services/'+encodeURIComponent(id)+'/base-price',{method:'POST',body:JSON.stringify({value:Number(el.value)||0})}); await refreshAll(); return;} if(a==='updateOptionPrice'){const s=state.admin.services.find(i=>i.id===sid); const o=s?(s.options||[]).find(i=>i.id===id):null; await api('/api/admin/services/'+encodeURIComponent(sid)+'/options/'+encodeURIComponent(id),{method:'POST',body:JSON.stringify({price:Number(el.value)||0,enabled:o?o.enabled!==false:true})}); await refreshAll(); return;} if(a==='toggleOption'){const s=state.admin.services.find(i=>i.id===sid); const o=s?(s.options||[]).find(i=>i.id===id):null; if(!o) return; await api('/api/admin/services/'+encodeURIComponent(sid)+'/options/'+encodeURIComponent(id),{method:'POST',body:JSON.stringify({price:Number(o.price)||0,enabled:!(o.enabled!==false)})}); await refreshAll(); return;} if(a==='replyToReview'){const reply=(document.getElementById('reply-'+id)||{}).value||''; await api('/api/admin/reviews/'+encodeURIComponent(id)+'/reply',{method:'POST',body:JSON.stringify({reply})}); await refreshAll(); return;} if(a==='deleteReview'){if(!confirm('Удалить отзыв?')) return; await api('/api/admin/reviews/'+encodeURIComponent(id),{method:'DELETE'}); await refreshAll(); return;} if(a==='createPayout'){const amount=Number((document.getElementById('payoutAmount')||{}).value||0); const cardNumber=((document.getElementById('cardNumber')||{}).value||'').trim(); await api('/api/admin/payouts',{method:'POST',body:JSON.stringify({amount,cardNumber})}); await refreshAll(); return;} if(a==='resetAllData'){if(!confirm('Точно сбросить все данные?')) return; await api('/api/admin/reset',{method:'POST',body:JSON.stringify({})}); await refreshAll(); return;}}catch(err){alert(err.message||'Ошибка запроса');}}
function render(){document.getElementById('app').innerHTML=currentViewHtml(); bind();}
(async function(){await refreshAll(); setInterval(()=>refreshAll(),15000);})();
</script></body></html>
