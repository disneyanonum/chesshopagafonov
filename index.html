<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agafonov Coach Chess</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      background-color: #f6f1e7;
      background-image:
        radial-gradient(circle at top right, rgba(185,146,82,0.15), transparent 28%),
        radial-gradient(circle at bottom left, rgba(49,70,59,0.12), transparent 30%),
        linear-gradient(135deg, rgba(255,255,255,0.35) 25%, transparent 25%),
        linear-gradient(225deg, rgba(255,255,255,0.18) 25%, transparent 25%);
      background-size: auto, auto, 40px 40px, 40px 40px;
      color: #2e2f33;
    }
    button, input, textarea, select { font: inherit; }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 20px; }
    .card { background: rgba(255,255,255,0.96); border: 1px solid rgba(185,146,82,0.14); border-radius: 28px; box-shadow: 0 18px 60px rgba(0,0,0,0.08); }
    .subtle-box { background: rgba(235,228,214,0.5); border-radius: 18px; padding: 14px; }
    .badge { display: inline-flex; border-radius: 999px; padding: 6px 10px; background: rgba(185,146,82,0.12); color: #b99252; font-size: 12px; font-weight: 700; border: 1px solid rgba(185,146,82,0.25); }
    .btn { border: none; border-radius: 16px; padding: 12px 18px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; }
    .btn-primary { background: #2e2f33; color: #fff; box-shadow: 0 10px 24px rgba(46,47,51,0.16); }
    .btn-secondary { background: #fff; color: #2e2f33; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1); }
    .btn-danger { background: #6b3b42; color: #fff; }
    .btn-green { background: #31463b; color: #fff; }
    .field { width: 100%; border-radius: 16px; border: 1px solid rgba(0,0,0,0.1); padding: 12px 14px; font-size: 14px; background: #fff; }
    .section-title { font-size: 34px; line-height: 1.15; margin: 0; font-weight: 900; letter-spacing: -0.02em; }
    .hero-title { font-size: 54px; line-height: 1.02; margin: 18px 0 0; font-weight: 900; letter-spacing: -0.03em; }
    header { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px); background: rgba(247,243,235,0.82); border-bottom: 1px solid rgba(0,0,0,0.06); }
    .header-inner { height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    nav { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
    .nav-link { background: transparent; border: none; cursor: pointer; color: #2e2f33; font-size: 14px; font-weight: 600; }
    main { padding: 24px 20px 60px; }
    footer { border-top: 1px solid rgba(0,0,0,0.06); padding: 22px 20px 32px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .service-card { padding: 22px; display: flex; flex-direction: column; justify-content: space-between; min-height: 300px; }
    .review-card { padding: 24px; display: grid; gap: 14px; background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,244,236,0.98)); }
    .click-card { text-align: left; width: 100%; border: none; cursor: pointer; }
    .toast { position: fixed; right: 18px; bottom: 18px; background: #2e2f33; color: #fff; padding: 14px 16px; border-radius: 14px; box-shadow: 0 12px 34px rgba(0,0,0,0.18); display: none; z-index: 999; }
    .toast.show { display: block; }
    @media (max-width: 1180px) {
      .grid-2, .grid-3, .grid-4, .grid-5, .grid-home, .admin-options { grid-template-columns: 1fr !important; }
      .header-inner { height: auto; padding: 14px 0; }
      .hero-title { font-size: 38px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <button id="homeLogo" class="nav-link" style="font-size:20px;font-weight:900;">Agafonov Coach Chess</button>
      <nav>
        <button class="nav-link" data-view="services">Услуги</button>
        <button class="nav-link" data-view="about">Обо мне</button>
        <button class="nav-link" data-view="reviews">Отзывы</button>
        <button class="nav-link" data-view="profile">Профиль</button>
        <button id="adminNavBtn" class="btn btn-primary" style="background:#b99252;padding:10px 14px;">Админ</button>
      </nav>
    </div>
  </header>
  <main class="container"><div id="app"></div></main>
  <footer>
    <div class="container" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:rgba(46,47,51,0.66);font-size:14px;">
      <div>© 2026 Agafonov Coach Chess</div>
      <div>Шахматные услуги, обучение, разбор партий, турниры и практические сессии.</div>
    </div>
  </footer>
  <div id="toast" class="toast"></div>
<script>
const state = {
  view: 'home',
  services: [], reviews: [], orders: [], payouts: [], stats: { averageRating: 0, completedOrdersCount: 0, turnover: 0, totalPayouts: 0, balance: 0 },
  selectedServiceId: null, selectedOrderId: null, adminAuthed: false, draftCheckout: null, reviewFilter: 'all', profileFilter: 'all', lastCreatedOrder: null
};

function esc(text) { return String(text ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatPrice(price) { return Number(price || 0).toLocaleString('ru-RU') + ' ₽'; }
function formatDate(v) { return new Date(v).toLocaleDateString('ru-RU'); }
function formatDateTime(v) { return new Date(v).toLocaleString('ru-RU'); }
function statusLabel(status) { return ({ DEMO_PAID:'Оплачено', PENDING_FULFILLMENT:'Ожидает выполнения', IN_PROGRESS:'Выполняется', DONE_BY_ADMIN:'Выполнено администратором', CONFIRMED_BY_CLIENT:'Подтверждено клиентом', REVIEW_LEFT:'Отзыв оставлен' })[status] || status; }
function orderTimeline(status) { const steps = ['DEMO_PAID','PENDING_FULFILLMENT','IN_PROGRESS','DONE_BY_ADMIN','CONFIRMED_BY_CLIENT','REVIEW_LEFT']; const index = Math.max(steps.indexOf(status),0); return steps.map((step,i)=>({key:step,done:i<=index})); }
function minEnabledPrice(service) { const enabled = service.options.filter(item => item.enabled !== false); return enabled.length ? Math.min(...enabled.map(item => item.price)) : service.basePrice; }
function selectedService() { return state.services.find(s => s.id === state.selectedServiceId) || null; }
function selectedOrder() { return state.orders.find(o => o.id === state.selectedOrderId) || null; }
function filteredReviews() { return state.reviewFilter === 'all' ? state.reviews : state.reviews.filter(r => r.rating === Number(state.reviewFilter)); }
function profileReviews() { return state.profileFilter === 'all' ? state.reviews : state.reviews.filter(r => r.rating === Number(state.profileFilter)); }
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2500); }
async function api(url, options = {}) {
  const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', ...options });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Ошибка запроса');
  return data;
}
async function loadPublic() {
  const data = await api('/api/bootstrap');
  state.services = data.services; state.reviews = data.reviews; state.stats = data.stats; state.adminAuthed = Boolean(data.adminAuthed);
}
async function loadAdmin() {
  const data = await api('/api/admin/bootstrap');
  state.services = data.services; state.orders = data.orders; state.reviews = data.reviews; state.payouts = data.payouts; state.stats = data.stats;
}
function serviceCard(service) {
  return '<div class="card service-card" style="background:linear-gradient(180deg, rgba(255,255,255,0.98), ' + service.heroAccent + ')">' +
    '<div><div style="display:flex;justify-content:space-between;gap:12px;align-items:start;">' +
      '<div><div style="font-size:22px;font-weight:800;line-height:1.2;">' + esc(service.title) + '</div><div style="font-size:14px;line-height:1.7;margin-top:10px;color:rgba(46,47,51,0.72);">' + esc(service.shortDesc) + '</div></div>' +
      (service.badge ? '<span class="badge">' + esc(service.badge) + '</span>' : '') +
    '</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;"><span class="badge" style="background:rgba(49,70,59,0.08);color:#31463b;border-color:rgba(49,70,59,0.18);">' + esc(service.category) + '</span></div>' +
    '<div class="subtle-box" style="margin-top:18px;">От <strong>' + esc(formatPrice(minEnabledPrice(service))) + '</strong></div></div>' +
    '<div style="display:flex;gap:10px;margin-top:18px;"><button class="btn btn-primary" data-action="openService" data-id="' + esc(service.id) + '" style="width:100%;">Выбрать</button></div></div>';
}
function reviewCard(review) {
  return '<div class="card review-card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:start;"><div><div style="font-weight:800;font-size:18px;">' + esc(review.customerName) + '</div><div style="font-size:13px;color:rgba(46,47,51,0.58);margin-top:6px;">Отзыв от ' + esc(formatDate(review.createdAt)) + '</div></div><span class="badge">' + esc(review.rating) + ' ★</span></div>' +
  '<div class="subtle-box" style="display:grid;gap:8px;"><div style="font-size:14px;font-weight:700;">' + esc(review.serviceTitle) + '</div><div style="font-size:13px;color:rgba(46,47,51,0.7);">Вариант: ' + esc(review.optionLabel) + '</div><div style="font-size:13px;color:rgba(46,47,51,0.7);">Сумма заказа: ' + esc(formatPrice(review.amount)) + '</div><div style="font-size:13px;color:rgba(46,47,51,0.7);">Куплено: ' + esc(formatDate(review.purchasedAt)) + '</div></div>' +
  '<div style="color:rgba(46,47,51,0.82);line-height:1.8;font-size:14px;">' + esc(review.text) + '</div>' +
  (review.adminReply ? '<div style="border-radius:18px;padding:14px;background:rgba(185,146,82,0.06);border:1px solid rgba(185,146,82,0.2)"><div style="font-size:11px;color:#b99252;font-weight:800;text-transform:uppercase;letter-spacing:2px;">Ответ Agafonov Chess</div><div style="margin-top:8px;font-size:14px;color:rgba(46,47,51,0.8);">' + esc(review.adminReply) + '</div></div>' : '') +
  '</div>';
}
function infoBox(label, value, extra='') { return '<div class="subtle-box" style="' + extra + '"><div style="font-size:13px;color:rgba(46,47,51,0.58);">' + esc(label) + '</div><div style="margin-top:6px;font-weight:700;">' + esc(value) + '</div></div>'; }
function homeView() {
  return '<section style="padding:34px 0 16px;"><div class="grid-home" style="display:grid;gap:24px;grid-template-columns:1.4fr 0.9fr;">' +
    '<div class="card" style="padding:34px;background:radial-gradient(circle at top right, rgba(185,146,82,0.14), transparent 30%), linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,244,236,0.96));"><span class="badge">Онлайн-версия</span><h1 class="hero-title">Agafonov Coach Chess</h1><p style="color:#b99252;font-weight:800;font-size:20px;margin-top:12px;">Тренер по Шахматам</p><p style="max-width:720px;color:rgba(46,47,51,0.75);line-height:1.8;margin-top:18px;font-size:15px;">Теперь сайт онлайн: новые отзывы, заказы и изменения администратора видны всем пользователям сразу после обновления данных с сервера.</p><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;"><button class="btn btn-primary" data-view="services">Выбрать услугу</button><button class="btn btn-secondary" data-view="about">Обо мне</button></div>' +
    '<div class="grid-3" style="margin-top:24px;">' +
      '<div class="subtle-box" style="background:rgba(235,228,214,0.62)"><div style="font-size:28px;font-weight:900;">' + esc(String(state.stats.averageRating || 0)) + '</div><div style="font-size:13px;color:rgba(46,47,51,0.62);margin-top:6px;">средняя оценка</div></div>' +
      '<div class="subtle-box" style="background:rgba(235,228,214,0.62)"><div style="font-size:28px;font-weight:900;">' + esc(String(state.reviews.length)) + '</div><div style="font-size:13px;color:rgba(46,47,51,0.62);margin-top:6px;">отзывов</div></div>' +
      '<div class="subtle-box" style="background:rgba(235,228,214,0.62)"><div style="font-size:28px;font-weight:900;">' + esc(String(state.stats.completedOrdersCount || 0)) + '</div><div style="font-size:13px;color:rgba(46,47,51,0.62);margin-top:6px;">выполненных заказов</div></div>' +
    '</div></div>' +
    '<div class="card" style="padding:28px;background:#2e2f33;color:#fff;"><div style="font-size:12px;text-transform:uppercase;letter-spacing:3px;color:rgba(255,255,255,0.56)">Профиль продавца</div><div style="display:flex;gap:14px;align-items:center;margin-top:18px;"><div style="width:72px;height:72px;border-radius:24px;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900">A</div><div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><div style="font-size:24px;font-weight:900">Agafonov Chess</div><span class="badge" style="background:#b99252;color:#fff;border-color:transparent">✓</span></div><div style="font-size:14px;color:rgba(255,255,255,0.72);margin-top:4px;">Администратор</div></div></div><p style="line-height:1.75;font-size:14px;margin-top:22px;color:rgba(255,255,255,0.82)">Публичного раздела «Мои заказы» больше нет. Все заказы видны только в админке, чтобы обычные посетители не видели чужие заявки.</p></div>' +
    '</div></section>' +
    '<section style="padding:28px 0 8px;"><div style="margin-bottom:18px;"><h2 class="section-title" style="font-size:30px;">Популярные услуги</h2><p style="color:rgba(46,47,51,0.7);margin-top:10px;">Ключевые направления с быстрым доступом к заказу.</p></div><div class="grid-3">' + state.services.slice(0, 3).map(serviceCard).join('') + '</div></section>' +
    '<section style="padding:28px 0 8px;"><h2 class="section-title" style="font-size:30px;">Последние отзывы</h2><p style="color:rgba(46,47,51,0.7);margin-bottom:18px;margin-top:10px;">Отзывы теперь приходят с общего сервера и доступны всем пользователям.</p><div class="grid-3">' + state.reviews.slice(0, 3).map(reviewCard).join('') + '</div></section>';
}
function servicesView() { return '<div><h1 class="section-title">Услуги</h1><p style="color:rgba(46,47,51,0.7);margin-bottom:18px;margin-top:10px;">Выберите направление, вариант и оформите заказ.</p><div class="grid-3">' + state.services.map(serviceCard).join('') + '</div></div>'; }
function serviceView() {
  const service = selectedService(); if (!service) return '<div class="card" style="padding:24px;">Услуга не найдена.</div>';
  const activeOptions = service.options.filter(i => i.enabled !== false);
  return '<div class="grid-2" style="grid-template-columns:1.2fr 0.8fr;">' +
  '<div class="card" style="padding:28px;"><div style="display:flex;justify-content:space-between;gap:12px;align-items:start;"><div><h1 class="section-title">' + esc(service.title) + '</h1><p style="margin-top:12px;color:rgba(46,47,51,0.72);line-height:1.8;">' + esc(service.description) + '</p></div>' + (service.badge ? '<span class="badge">' + esc(service.badge) + '</span>' : '') + '</div><div class="subtle-box" style="margin-top:24px;"><div style="font-weight:900;">Доступные варианты</div><div style="margin-top:12px;display:grid;gap:10px;">' + service.options.map(option => '<div style="background:#fff;border-radius:18px;padding:14px;display:flex;justify-content:space-between;gap:10px;"><div style="font-weight:600;">' + esc(option.label) + '</div><div style="font-weight:800;">' + (option.enabled === false ? 'Недоступно' : esc(formatPrice(option.price))) + '</div></div>').join('') + '</div></div></div>' +
  '<div class="card" style="padding:28px;"><div style="font-size:12px;text-transform:uppercase;letter-spacing:3px;color:#b99252;font-weight:800;">Оформление заказа</div><p style="margin-top:14px;color:rgba(46,47,51,0.72);line-height:1.75;">После отправки заказ сразу попадёт в общую админ-панель на сервере.</p><div style="margin-top:16px;display:grid;gap:14px;"><div><label style="display:block;margin-bottom:8px;font-size:14px;font-weight:700;">Ваше имя</label><input id="customerNameInput" class="field" placeholder="Например, KnightRush"></div><div><label style="display:block;margin-bottom:8px;font-size:14px;font-weight:700;">Выберите вариант</label><select id="optionSelect" class="field">' + activeOptions.map(option => '<option value="' + esc(option.id) + '">' + esc(option.label) + ' — ' + esc(formatPrice(option.price)) + '</option>').join('') + '</select></div><div><label style="display:block;margin-bottom:8px;font-size:14px;font-weight:700;">Комментарий к заказу</label><textarea id="noteInput" rows="4" class="field" placeholder="Дополнительные пожелания"></textarea></div><button class="btn btn-primary" data-action="createOrder" data-id="' + esc(service.id) + '" style="width:100%;">Создать заказ</button></div></div></div>';
}
function checkoutSuccessView() {
  if (!state.lastCreatedOrder) return homeView();
  const order = state.lastCreatedOrder;
  const review = state.reviews.find(r => r.orderId === order.id);
  return '<div style="max-width:920px;margin:0 auto;display:grid;gap:18px;">' +
    '<div class="card" style="padding:28px;"><div style="font-size:12px;text-transform:uppercase;letter-spacing:3px;color:#b99252;font-weight:800;">Заказ создан</div><h1 class="section-title" style="margin-top:12px;">Спасибо, заявка отправлена</h1><p style="color:rgba(46,47,51,0.72);line-height:1.8;margin-top:10px;">Заказ уже есть в админке. Сохрани номер заявки, чтобы сверяться со статусом у администратора.</p><div class="grid-2" style="gap:14px;margin-top:22px;">' + infoBox('Номер заказа', order.id) + infoBox('Статус', statusLabel(order.status)) + infoBox('Услуга', order.serviceTitle) + infoBox('Сумма', formatPrice(order.amount)) + '</div>' + (order.note ? infoBox('Комментарий', order.note, 'margin-top:14px;') : '') + '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;"><button class="btn btn-secondary" data-view="home">На главную</button><button class="btn btn-primary" data-action="refreshPublic">Обновить отзывы и данные</button></div></div>' +
    (order.status === 'DONE_BY_ADMIN' || order.status === 'CONFIRMED_BY_CLIENT' || order.status === 'REVIEW_LEFT' ? '<div class="card" style="padding:24px;">' + orderTimeline(order.status).map(item => '<div style="display:flex;gap:10px;align-items:center;margin-top:10px;"><div style="width:10px;height:10px;border-radius:999px;background:' + (item.done ? '#b99252' : 'rgba(0,0,0,0.12)') + ';"></div><div style="color:' + (item.done ? '#2e2f33' : 'rgba(46,47,51,0.45)') + ';font-size:14px;">' + esc(statusLabel(item.key)) + '</div></div>').join('') + '</div>' : '') +
    (order.status === 'DONE_BY_ADMIN' ? '<div class="card" style="padding:24px;"><button class="btn btn-green" data-action="confirmCompletion" data-id="' + esc(order.id) + '" style="width:100%;">Подтвердить выполнение</button></div>' : '') +
    (order.status === 'CONFIRMED_BY_CLIENT' && !review ? '<div class="card" style="padding:24px;"><div style="font-weight:900;">Оставить отзыв</div><div style="margin-top:14px;display:grid;gap:12px;"><select id="reviewRating" class="field">' + [5,4,3,2,1].map(item => '<option value="' + item + '">' + item + ' звёзд</option>').join('') + '</select><textarea id="reviewText" rows="4" class="field" placeholder="Ваш отзыв"></textarea><button class="btn btn-primary" data-action="addReview" data-id="' + esc(order.id) + '" style="width:100%;">Опубликовать отзыв</button></div></div>' : '') +
    (review ? '<div class="card" style="padding:24px;"><div style="font-weight:900;">Ваш отзыв опубликован</div><div style="margin-top:10px;color:rgba(46,47,51,0.72);font-size:14px;line-height:1.7;">' + esc(review.rating) + ' ★ · ' + esc(review.text) + '</div></div>' : '') +
  '</div>';
}
function reviewsView() { return '<div><h1 class="section-title">Отзывы</h1><p style="color:rgba(46,47,51,0.7);margin-bottom:16px;margin-top:10px;">Публичные отзывы, которые видят все посетители сайта.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;">' + ['all',5,4,3,2,1].map(item => '<button class="btn ' + (String(state.reviewFilter) === String(item) ? 'btn-primary' : 'btn-secondary') + '" data-action="setReviewFilter" data-id="' + item + '" style="padding:10px 14px;">' + (item === 'all' ? 'Все' : item + ' ★') + '</button>').join('') + '</div><div class="grid-3">' + filteredReviews().map(reviewCard).join('') + '</div></div>'; }
function profileView() {
  return '<div><h1 class="section-title">Профиль</h1><p style="color:rgba(46,47,51,0.7);margin-bottom:18px;margin-top:10px;">Agafonov Chess — подтверждённый профиль администратора.</p><div class="grid-2" style="grid-template-columns:0.9fr 1.1fr;"><div class="card" style="padding:26px;background:#2e2f33;color:#fff;"><div style="display:flex;align-items:center;gap:14px;"><div style="width:84px;height:84px;border-radius:26px;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;">A</div><div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><div style="font-size:28px;font-weight:900;">Agafonov Chess</div><span class="badge" style="background:#b99252;color:#fff;border-color:transparent">✓</span></div><div style="color:rgba(255,255,255,0.72);margin-top:4px;">Администратор</div></div></div><p style="margin-top:20px;color:rgba(255,255,255,0.82);line-height:1.8;font-size:14px;">Шахматист-самоучка, играю 3 года, лига Легенда в 2024–2025, более 13k партий и 904 турниров.</p><div class="grid-3" style="gap:10px;margin-top:18px;"><div style="background:rgba(255,255,255,0.1);border-radius:18px;padding:14px;"><div style="font-size:24px;font-weight:900;">' + state.reviews.length + '</div><div style="font-size:12px;color:rgba(255,255,255,0.7)">отзывов</div></div><div style="background:rgba(255,255,255,0.1);border-radius:18px;padding:14px;"><div style="font-size:24px;font-weight:900;">' + esc(String(state.stats.averageRating || 0)) + '</div><div style="font-size:12px;color:rgba(255,255,255,0.7)">рейтинг</div></div><div style="background:rgba(255,255,255,0.1);border-radius:18px;padding:14px;"><div style="font-size:24px;font-weight:900;">' + esc(String(state.stats.completedOrdersCount || 0)) + '</div><div style="font-size:12px;color:rgba(255,255,255,0.7)">выполнено</div></div></div></div><div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">' + ['all',5,4,3,2,1].map(item => '<button class="btn ' + (String(state.profileFilter) === String(item) ? 'btn-primary' : 'btn-secondary') + '" data-action="setProfileFilter" data-id="' + item + '" style="padding:10px 14px;">' + (item === 'all' ? 'Все отзывы' : item + ' ★') + '</button>').join('') + '</div><div style="display:grid;gap:12px;">' + profileReviews().map(reviewCard).join('') + '</div></div></div></div>';
}
function aboutView() { return '<div><h1 class="section-title">Обо мне</h1><p style="color:rgba(46,47,51,0.7);margin-bottom:18px;margin-top:10px;">История, достижения, опыт и преимущества работы.</p><div class="grid-2" style="grid-template-columns:1.1fr 0.9fr;"><div class="card" style="padding:26px;"><span class="badge">Agafonov Chess</span><p style="margin-top:18px;line-height:1.9;color:rgba(46,47,51,0.82);">Agafonov Chess — шахматист-самоучка, играю на протяжении 3-х лет. Имел Лигу Легенда (2024–2025). Сыграл свыше 13k+ партий за всё время. Сыграл 904 турнира за всё время. Прошёл теоретические курсы chess.com. Завершил свыше 130 курсов старшей игры. Спеши получить помощь от профи.</p></div><div class="card" style="padding:26px;background:#2e2f33;color:#fff;"><h3 style="font-size:24px;margin-top:0;margin-bottom:12px;">Преимущества</h3><ul style="margin:0;padding-left:18px;line-height:2;color:rgba(255,255,255,0.82);"><li>Индивидуальный подбор услуг под рейтинг и цель.</li><li>Онлайн-обучение на 1–3 часа с понятной структурой.</li><li>Отдельные тактические модули и полноценная программа.</li><li>Онлайн-синхронизация с базой сайта.</li></ul></div></div></div>'; }
function adminLoginView() { return '<div style="max-width:480px;margin:40px auto 0;"><div class="card" style="padding:28px;"><div style="font-size:12px;text-transform:uppercase;letter-spacing:3px;color:#b99252;font-weight:800;">Вход администратора</div><h1 class="section-title" style="margin-top:12px;">Agafonov Admin</h1><div style="margin-top:18px;display:grid;gap:14px;"><input id="adminPasswordInput" type="password" class="field" placeholder="Пароль"><button class="btn btn-primary" data-action="loginAdmin" style="width:100%;">Войти</button></div></div></div>'; }
function adminView() {
  return '<div><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;"><div><h1 class="section-title">Админ-панель</h1><p style="color:rgba(46,47,51,0.7);margin-top:10px;">Все заказы теперь скрыты от обычных посетителей и доступны только здесь.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-secondary" data-action="logoutAdmin">Выйти</button><button class="btn btn-danger" data-action="resetAllData">Сбросить все данные</button><button class="btn btn-primary" data-action="refreshAdmin">Обновить данные</button></div></div>' +
  '<div class="grid-5" style="margin-top:16px;"><div class="card" style="padding:18px;"><div style="font-size:13px;color:rgba(46,47,51,0.58);">Услуги</div><div style="margin-top:10px;font-size:28px;font-weight:900;">' + state.services.length + '</div></div><div class="card" style="padding:18px;"><div style="font-size:13px;color:rgba(46,47,51,0.58);">Заказы</div><div style="margin-top:10px;font-size:28px;font-weight:900;">' + state.orders.length + '</div></div><div class="card" style="padding:18px;"><div style="font-size:13px;color:rgba(46,47,51,0.58);">Отзывы</div><div style="margin-top:10px;font-size:28px;font-weight:900;">' + state.reviews.length + '</div></div><div class="card" style="padding:18px;"><div style="font-size:13px;color:rgba(46,47,51,0.58);">Оборот</div><div style="margin-top:10px;font-size:28px;font-weight:900;">' + esc(formatPrice(state.stats.turnover)) + '</div></div><div class="card" style="padding:18px;"><div style="font-size:13px;color:rgba(46,47,51,0.58);">Баланс</div><div style="margin-top:10px;font-size:28px;font-weight:900;">' + esc(formatPrice(state.stats.balance)) + '</div></div></div>' +
  '<div class="grid-2" style="grid-template-columns:1.15fr 1fr;margin-top:24px;"><div style="display:grid;gap:18px;"><div class="card" style="padding:22px;"><h2 style="font-size:24px;margin-top:0;margin-bottom:6px;">Товары и цены</h2><div style="display:grid;gap:14px;">' + state.services.map(service => '<div style="border-top:1px solid rgba(0,0,0,0.06);padding-top:14px;"><div style="display:grid;gap:10px;"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;"><strong>' + esc(service.title) + '</strong><label style="display:flex;align-items:center;gap:8px;font-size:14px;">Базовая цена <input class="field" style="width:120px;padding:8px 10px;" type="number" value="' + esc(service.basePrice) + '" data-action="updateServiceBasePrice" data-id="' + esc(service.id) + '"></label></div><div style="display:grid;gap:10px;">' + service.options.map(option => '<div class="admin-options" style="display:grid;grid-template-columns:1fr 120px 120px;gap:10px;align-items:center;"><div style="font-size:14px;">' + esc(option.label) + '</div><input class="field" style="padding:8px 10px;" type="number" value="' + esc(option.price) + '" data-action="updateOptionPrice" data-service="' + esc(service.id) + '" data-id="' + esc(option.id) + '"><button class="btn ' + (option.enabled !== false ? 'btn-primary' : 'btn-secondary') + '" data-action="toggleOption" data-service="' + esc(service.id) + '" data-id="' + esc(option.id) + '">' + (option.enabled === false ? 'Включить' : 'Выключить') + '</button></div>').join('') + '</div></div></div>').join('') + '</div></div>' +
  '<div class="card" style="padding:22px;"><h2 style="font-size:24px;margin-top:0;margin-bottom:6px;">Заказы</h2><div style="display:grid;gap:12px;">' + state.orders.map(order => '<div style="border-top:1px solid rgba(0,0,0,0.06);padding-top:12px;"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;"><div><div style="font-weight:800;">' + esc(order.serviceTitle) + '</div><div style="font-size:14px;color:rgba(46,47,51,0.64);margin-top:4px;">' + esc(order.optionLabel) + ' · ' + esc(order.customerName) + '</div><div style="font-size:13px;color:rgba(46,47,51,0.54);margin-top:4px;">' + esc(formatPrice(order.amount)) + ' · ' + esc(formatDateTime(order.createdAt)) + '</div><div style="font-size:12px;color:#b99252;margin-top:4px;">ID: ' + esc(order.id) + '</div></div><select class="field" style="width:240px;padding:10px 12px;" data-action="updateOrderStatus" data-id="' + esc(order.id) + '">' + ['DEMO_PAID','PENDING_FULFILLMENT','IN_PROGRESS','DONE_BY_ADMIN','CONFIRMED_BY_CLIENT','REVIEW_LEFT'].map(status => '<option value="' + status + '"' + (order.status === status ? ' selected' : '') + '>' + esc(statusLabel(status)) + '</option>').join('') + '</select></div></div>').join('') + '</div></div></div>' +
  '<div style="display:grid;gap:18px;"><div class="card" style="padding:22px;"><h2 style="font-size:24px;margin-top:0;margin-bottom:6px;">Отзывы</h2><div style="display:grid;gap:12px;">' + state.reviews.map(review => '<div style="border-top:1px solid rgba(0,0,0,0.06);padding-top:12px;"><div style="display:flex;justify-content:space-between;gap:10px;align-items:start;"><div><div style="font-weight:800;">' + esc(review.customerName) + '</div><div style="font-size:13px;color:rgba(46,47,51,0.56);margin-top:4px;">' + esc(review.serviceTitle) + ' · ' + esc(review.optionLabel) + ' · ' + esc(formatPrice(review.amount)) + '</div></div><span class="badge">' + esc(review.rating) + ' ★</span></div><div style="margin-top:10px;font-size:14px;color:rgba(46,47,51,0.78);line-height:1.7;">' + esc(review.text) + '</div><div style="display:grid;gap:8px;margin-top:12px;"><input id="reply-' + esc(review.id) + '" class="field" value="' + esc(review.adminReply || '') + '" placeholder="Ответ администратора"><div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-primary" data-action="replyToReview" data-id="' + esc(review.id) + '">Сохранить ответ</button><button class="btn btn-danger" data-action="deleteReview" data-id="' + esc(review.id) + '">Удалить отзыв</button></div></div></div>').join('') + '</div></div>' +
  '<div class="card" style="padding:22px;"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;"><h2 style="font-size:24px;margin:0;">Баланс и выплаты</h2><span class="badge">Финансы</span></div><div class="grid-3" style="gap:12px;margin-top:16px;"><div class="subtle-box"><div style="font-size:12px;color:rgba(46,47,51,0.58);">Оборот</div><div style="margin-top:8px;font-size:22px;font-weight:800;">' + esc(formatPrice(state.stats.turnover)) + '</div></div><div class="subtle-box"><div style="font-size:12px;color:rgba(46,47,51,0.58);">Выведено</div><div style="margin-top:8px;font-size:22px;font-weight:800;">' + esc(formatPrice(state.stats.totalPayouts)) + '</div></div><div class="subtle-box"><div style="font-size:12px;color:rgba(46,47,51,0.58);">Баланс</div><div style="margin-top:8px;font-size:22px;font-weight:800;">' + esc(formatPrice(state.stats.balance)) + '</div></div></div><div style="display:grid;gap:10px;margin-top:16px;"><input id="cardNumber" class="field" placeholder="Номер карты"><input id="payoutAmount" class="field" placeholder="Сумма" type="number"><button class="btn btn-primary" data-action="createPayout">Создать заявку на вывод</button></div><div style="margin-top:16px;display:grid;gap:10px;">' + state.payouts.map(payout => '<div class="subtle-box"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;"><strong>' + esc(formatPrice(payout.amount)) + '</strong><span class="badge">Создано</span></div><div style="font-size:14px;color:rgba(46,47,51,0.62);margin-top:6px;">' + esc(payout.cardNumber) + '</div></div>').join('') + '</div></div></div></div></div>';
}
function currentViewHtml() {
  switch (state.view) {
    case 'home': return homeView();
    case 'services': return servicesView();
    case 'service': return serviceView();
    case 'checkout-success': return checkoutSuccessView();
    case 'reviews': return reviewsView();
    case 'profile': return profileView();
    case 'about': return aboutView();
    case 'admin-login': return adminLoginView();
    case 'admin': return adminView();
    default: return homeView();
  }
}
function bindEvents() {
  document.querySelectorAll('[data-view]').forEach(el => el.onclick = () => { state.view = el.getAttribute('data-view'); render(); });
  document.querySelectorAll('[data-action]').forEach(el => {
    const action = el.getAttribute('data-action');
    if (el.tagName === 'SELECT' || (el.tagName === 'INPUT' && ['updateServiceBasePrice','updateOptionPrice'].includes(action))) {
      el.onchange = handleAction;
    } else {
      el.onclick = handleAction;
    }
  });
  document.getElementById('homeLogo').onclick = () => { state.view = 'home'; render(); };
  document.getElementById('adminNavBtn').onclick = async () => { if (state.adminAuthed) { await refreshAdmin(); state.view = 'admin'; } else { state.view = 'admin-login'; } render(); };
}
async function refreshPublic() { await loadPublic(); render(); }
async function refreshAdmin() { await loadAdmin(); render(); }
async function handleAction(event) {
  const el = event.currentTarget; const action = el.getAttribute('data-action'); const id = el.getAttribute('data-id'); const serviceId = el.getAttribute('data-service');
  try {
    switch (action) {
      case 'openService': state.selectedServiceId = id; state.view = 'service'; render(); break;
      case 'createOrder': {
        const optionId = document.getElementById('optionSelect').value;
        const customerName = document.getElementById('customerNameInput').value || 'Гость';
        const note = document.getElementById('noteInput').value || '';
        const data = await api('/api/orders', { method: 'POST', body: JSON.stringify({ serviceId: id, optionId, customerName, note }) });
        state.lastCreatedOrder = data.order; state.view = 'checkout-success'; toast('Заказ отправлен'); render();
        break;
      }
      case 'confirmCompletion': await api('/api/orders/' + id + '/confirm', { method: 'PATCH' }); state.lastCreatedOrder.status = 'CONFIRMED_BY_CLIENT'; toast('Выполнение подтверждено'); render(); break;
      case 'addReview': await api('/api/reviews', { method: 'POST', body: JSON.stringify({ orderId: id, rating: Number(document.getElementById('reviewRating').value), text: document.getElementById('reviewText').value }) }); await loadPublic(); state.lastCreatedOrder.status = 'REVIEW_LEFT'; toast('Отзыв опубликован'); render(); break;
      case 'loginAdmin': await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ password: document.getElementById('adminPasswordInput').value }) }); state.adminAuthed = true; await refreshAdmin(); state.view = 'admin'; break;
      case 'logoutAdmin': await api('/api/admin/logout', { method: 'POST' }); state.adminAuthed = false; await loadPublic(); state.view = 'home'; render(); break;
      case 'updateOrderStatus': await api('/api/admin/orders/' + id, { method: 'PATCH', body: JSON.stringify({ status: el.value }) }); await refreshAdmin(); toast('Статус обновлён'); break;
      case 'updateServiceBasePrice': await api('/api/admin/services/' + id + '/base-price', { method: 'PATCH', body: JSON.stringify({ basePrice: Number(el.value) || 0 }) }); await refreshAdmin(); break;
      case 'updateOptionPrice': await api('/api/admin/services/' + serviceId + '/options/' + id, { method: 'PATCH', body: JSON.stringify({ price: Number(el.value) || 0 }) }); await refreshAdmin(); break;
      case 'toggleOption': {
        const service = state.services.find(s => s.id === serviceId);
        const option = service.options.find(o => o.id === id);
        await api('/api/admin/services/' + serviceId + '/options/' + id, { method: 'PATCH', body: JSON.stringify({ enabled: !(option.enabled !== false) , price: option.price }) });
        await refreshAdmin();
        break;
      }
      case 'replyToReview': await api('/api/admin/reviews/' + id + '/reply', { method: 'PATCH', body: JSON.stringify({ reply: document.getElementById('reply-' + id).value }) }); await refreshAdmin(); toast('Ответ сохранён'); break;
      case 'deleteReview': if (confirm('Удалить отзыв?')) { await api('/api/admin/reviews/' + id, { method: 'DELETE' }); await refreshAdmin(); toast('Отзыв удалён'); } break;
      case 'createPayout': await api('/api/admin/payouts', { method: 'POST', body: JSON.stringify({ amount: Number(document.getElementById('payoutAmount').value), cardNumber: document.getElementById('cardNumber').value }) }); await refreshAdmin(); toast('Заявка на вывод создана'); break;
      case 'resetAllData': if (confirm('Точно сбросить все данные?')) { await api('/api/admin/reset', { method: 'POST' }); await refreshAdmin(); toast('Данные сброшены'); } break;
      case 'setReviewFilter': state.reviewFilter = id === 'all' ? 'all' : Number(id); render(); break;
      case 'setProfileFilter': state.profileFilter = id === 'all' ? 'all' : Number(id); render(); break;
      case 'refreshPublic': await refreshPublic(); toast('Данные обновлены'); break;
      case 'refreshAdmin': await refreshAdmin(); toast('Данные обновлены'); break;
    }
  } catch (error) { toast(error.message); }
}
function render() { document.getElementById('app').innerHTML = currentViewHtml(); bindEvents(); }
(async function init() { try { await loadPublic(); render(); setInterval(async () => { try { if (state.view === 'admin' && state.adminAuthed) { await loadAdmin(); } else { await loadPublic(); } render(); } catch {} }, 15000); } catch (error) { document.getElementById('app').innerHTML = '<div class="card" style="padding:24px;">Ошибка запуска сайта: ' + esc(error.message) + '</div>'; } })();
</script>
</body>
</html>
